<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Calculator</title>
</head>
<body>
    <h1>Grade Calculator</h1>
    <form id="gradeForm">
        <label for="score">Enter your score (0-100):</label>
        <input type="number" id="score" name="score" min="0" max="100" required>
        <button type="submit">Calculate Grade</button>
    </form>
    <p id="result"></p>

    <script>
        //create a grade calculator that take multiple 
        document.getElementById('gradeForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const score = parseInt(document.getElementById('score').value);
            let grade;
            if (score >= 90) {
                grade = 'A';
            } else if (score >= 80) {
                grade = 'B';
            } else if (score >= 70) {
                grade = 'C';
            } else if (score >= 60) {
                grade = 'D';
            } else {
                grade = 'F';
            }
            document.getElementById('result').textContent = 'Your grade is: ' + grade;
        });
    </script>
</body>
</html>
