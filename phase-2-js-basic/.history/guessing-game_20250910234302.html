<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number guessing game</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.984);
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            padding: 10px 15px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #218838;
        }

        #resultMessage {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Welcome to the Number Guessing Game!</h1>
        <p>Guess a number between 1 and 100:</p>
        <input type="number" id="userGuess" min="1" max="100">
        <button id="submitGuess">Submit Guess</button>
        <p id="resultMessage">Result</p>
    </div>

    <script>
        const randomNumber = Math.floor(Math.random() * 100) + 1;
        const submitGuessButton = document.getElementById('submitGuess');
        const resultMessage = document.getElementById('resultMessage');

        document.getElementById('userGuess').value = '';
        let counter = 0;
        submitGuessButton.addEventListener('click', () => {
            if (counter < 10) {
                const userGuess = parseInt(document.getElementById('userGuess').value);
                if (isNaN(userGuess) || userGuess < 1 || userGuess > 100) {
                    resultMessage.style.color = 'maroon';
                    resultMessage.textContent = 'Please enter a valid number between 1 and 100.';
                    return;
                }
                counter++;
                if (userGuess === randomNumber) {
                    resultMessage.style.color = 'green';
                    resultMessage.textContent = `Congratulations! You've guessed the number ${randomNumber} correctly in ${counter} attempts!`;
                    submitGuessButton.disabled = true;
                } else if (userGuess < randomNumber) {
                    resultMessage.style.color = 'lightblue';
                    resultMessage.textContent = 'Too low! Try again.';
                } else {
                    resultMessage.style.color = 'lightcoral';
                    resultMessage.textContent = 'Too high! Try again.';
                }
            } else {
                resultMessage.textContent = `Game over! The correct number was ${randomNumber}.`;
                resultMessage.style.color = 'red';
                submitGuessButton.disabled = true;
            }
        });
    </script>
</body>

</html>
